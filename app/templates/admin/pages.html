{% extends 'admin/base.html' %}{% block title %}Gerenciar páginas{% endblock %}{% block admin_content %}<div class="admin-header"><div><span class="eyebrow">Conteúdo</span><h1>Páginas</h1></div></div><div class="admin-form"><h2>Nova página</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Slug<input required name="slug" placeholder="tcc"></label><label>Título<input required name="title"></label><label>Categoria<input name="category"></label></div><label>Conteúdo<textarea name="content" rows="12"></textarea></label><label><input type="checkbox" name="published" checked> Publicada</label><button class="btn btn-primary">Salvar</button></form></div><div class="admin-table"><table><thead><tr><th>Título</th><th>Slug</th><th>Categoria</th></tr></thead><tbody>{% for p in pages %}<tr><td>{{ p.title }}</td><td>{{ p.slug }}</td><td>{{ p.category or '—' }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
