{% extends 'admin/base.html' %}{% block title %}Entradas{% endblock %}{% block admin_content %}<div class="admin-header"><div><span class="eyebrow">Ingresso</span><h1>Cronograma de entradas</h1></div></div><div class="admin-form"><h2>Nova entrada</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Ano<input required type="number" name="year"></label><label>Turno<input required name="shift" placeholder="Noturno"></label><label>Matriz<input type="number" name="matrix_year"></label></div><label>Observações<textarea name="notes"></textarea></label><label><input type="checkbox" name="published" checked> Publicada</label><button class="btn btn-primary">Salvar</button></form></div><div class="admin-table"><table><thead><tr><th>Ano</th><th>Turno</th><th>Matriz</th></tr></thead><tbody>{% for e in entries %}<tr><td>{{ e.year }}</td><td>{{ e.shift }}</td><td>{{ e.matrix_year or '—' }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
