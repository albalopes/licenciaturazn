{% extends 'admin/base.html' %}{% block title %}FAQ{% endblock %}{% block admin_content %}<div class="admin-header"><div><span class="eyebrow">Conteúdo</span><h1>Dúvidas frequentes</h1></div></div><div class="admin-form"><h2>Nova pergunta</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Pergunta<input required name="question"></label><label>Categoria<input name="category"></label><label>Posição<input type="number" name="position" value="0"></label></div><label>Resposta<textarea required name="answer"></textarea></label><label><input type="checkbox" name="published" checked> Publicada</label><button class="btn btn-primary">Salvar</button></form></div><div class="admin-table"><table><thead><tr><th>Categoria</th><th>Pergunta</th><th>Pos.</th></tr></thead><tbody>{% for f in faqs %}<tr><td>{{ f.category or '—' }}</td><td>{{ f.question }}</td><td>{{ f.position }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
