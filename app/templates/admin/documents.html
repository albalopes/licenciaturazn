{% extends 'admin/base.html' %}{% block title %}Gerenciar documentos{% endblock %}{% block admin_content %}<div class="admin-header"><div><span class="eyebrow">Documentos</span><h1>Documentos</h1></div></div><div class="admin-form"><h2>Novo documento</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Título<input required name="title"></label><label>Categoria<input required name="category"></label><label>URL<input required name="url"></label></div><label>Descrição<textarea name="description"></textarea></label><label><input type="checkbox" name="published" checked> Publicado</label><button class="btn btn-primary">Salvar</button></form></div><div class="admin-table"><table><thead><tr><th>Título</th><th>Categoria</th><th>URL</th></tr></thead><tbody>{% for d in documents %}<tr><td>{{ d.title }}</td><td>{{ d.category }}</td><td><a href="{{ d.url }}" target="_blank" rel="noopener">Abrir</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
