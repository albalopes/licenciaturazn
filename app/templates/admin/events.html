{% extends 'admin/base.html' %}{% block title %}Gerenciar eventos{% endblock %}{% block admin_content %}<div class="admin-header"><div><span class="eyebrow">Calendário</span><h1>Eventos acadêmicos</h1></div></div><div class="admin-form"><h2>Novo evento</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Título<input required name="title"></label><label>Início<input required type="datetime-local" name="starts_at"></label><label>Fim<input type="datetime-local" name="ends_at"></label><label>Categoria<input name="category"></label><label>URL<input name="url"></label></div><label>Descrição<textarea name="description"></textarea></label><label><input type="checkbox" name="published" checked> Publicado</label><button class="btn btn-primary">Salvar</button></form></div><div class="admin-table"><table><thead><tr><th>Data</th><th>Evento</th><th>Categoria</th></tr></thead><tbody>{% for e in events %}<tr><td>{{ e.starts_at.strftime('%d/%m/%Y %H:%M') }}</td><td>{{ e.title }}</td><td>{{ e.category or '—' }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
