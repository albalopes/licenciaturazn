{% extends 'admin/base.html' %}{% block title %}Colegiado e NDE{% endblock %}{% block admin_content %}<div class="admin-header"><div><span class="eyebrow">Gestão</span><h1>Colegiado e NDE</h1></div></div><div class="admin-form"><h2>Novo membro</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Órgão<select name="body"><option value="colegiado">Colegiado</option><option value="nde">NDE</option></select></label><label>Nome<input required name="name"></label><label>Função<input name="role"></label><label>Mandato<input name="term"></label><label>Documento/Portaria<input name="document_url"></label></div><label><input type="checkbox" name="active" checked> Ativo</label><button class="btn btn-primary">Salvar</button></form></div><div class="admin-table"><table><thead><tr><th>Órgão</th><th>Nome</th><th>Função</th><th>Mandato</th></tr></thead><tbody>{% for m in members %}<tr><td>{{ m.body|upper }}</td><td>{{ m.name }}</td><td>{{ m.role or '—' }}</td><td>{{ m.term or '—' }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
