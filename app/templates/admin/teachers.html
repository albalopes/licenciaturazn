{% extends 'admin/base.html' %}{% block title %}Gerenciar docentes{% endblock %}{% block admin_content %}<div class="admin-header"><div><span class="eyebrow">Equipe</span><h1>Docentes</h1></div></div><div class="admin-form"><h2>Novo docente</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Nome<input required name="name"></label><label>E-mail<input name="email" type="email"></label><label>Foto (URL)<input name="photo_url"></label><label>Lattes<input name="lattes_url"></label><label>ORCID<input name="orcid_url"></label></div><label>Formação<textarea name="education"></textarea></label><label>Áreas<textarea name="areas"></textarea></label><label>Biografia<textarea name="bio"></textarea></label><label><input type="checkbox" name="active" checked> Ativo</label><button class="btn btn-primary">Salvar</button></form></div><div class="admin-table"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Ativo</th></tr></thead><tbody>{% for t in teachers %}<tr><td>{{ t.name }}</td><td>{{ t.email or '—' }}</td><td>{{ 'Sim' if t.active else 'Não' }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
