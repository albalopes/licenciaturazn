name: licenciaturazn

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licenciaturazn_web
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      PORT: ${PORT:-5003}
      DB_STARTUP_RETRIES: ${DB_STARTUP_RETRIES:-30}
      DB_STARTUP_RETRY_DELAY: ${DB_STARTUP_RETRY_DELAY:-2}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY nas variáveis da Stack}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL apontando para o MySQL existente}

      # SUAP OAuth2 / API
      SUAP_BASE_URL: ${SUAP_BASE_URL:-https://suap.ifrn.edu.br}
      SUAP_AUTH_URL: ${SUAP_AUTH_URL:-https://suap.ifrn.edu.br/o/authorize/}
      SUAP_TOKEN_URL: ${SUAP_TOKEN_URL:-https://suap.ifrn.edu.br/o/token/}
      SUAP_API_BASE_URL: ${SUAP_API_BASE_URL:-https://suap.ifrn.edu.br/api/}
      SUAP_CLIENT_ID: ${SUAP_CLIENT_ID:-}
      SUAP_CLIENT_SECRET: ${SUAP_CLIENT_SECRET:-}
      SUAP_REDIRECT_URI: ${SUAP_REDIRECT_URI:-http://localhost:5003/auth/suap/callback}
      SUAP_SCOPE: ${SUAP_SCOPE:-read identificacao email}
      SUAP_ENDPOINT_ME: ${SUAP_ENDPOINT_ME:-rh/eu/}
      SUAP_ENDPOINT_PERIODS: ${SUAP_ENDPOINT_PERIODS:-ensino/periodos/}
      SUAP_ENDPOINT_MY_LINKS: ${SUAP_ENDPOINT_MY_LINKS:-rh/meus-vinculos/}
      SUAP_ENDPOINT_MY_DATA: ${SUAP_ENDPOINT_MY_DATA:-rh/meus-dados/}
      SUAP_ENDPOINT_STUDENT_DATA: ${SUAP_ENDPOINT_STUDENT_DATA:-ensino/meus-dados-aluno/}
      SUAP_ENDPOINT_SERVERS: ${SUAP_ENDPOINT_SERVERS:-rh/servidores/}
      SUAP_CAMPUS_SIGLA: ${SUAP_CAMPUS_SIGLA:-ZN}
      SUAP_ENDPOINT_PROJECTS_RESEARCH: ${SUAP_ENDPOINT_PROJECTS_RESEARCH:-pesquisa/projetos/}
      SUAP_ENDPOINT_PROJECTS_EXTENSION: ${SUAP_ENDPOINT_PROJECTS_EXTENSION:-extensao/projetos/}
      SUAP_ENDPOINT_PROJECTS_TEACHING: ${SUAP_ENDPOINT_PROJECTS_TEACHING:-}
      SUAP_PROJECT_CAMPUS: ${SUAP_PROJECT_CAMPUS:-Natal-Zona-Norte}
      SUAP_ENDPOINT_VIRTUAL_CLASSES: ${SUAP_ENDPOINT_VIRTUAL_CLASSES:-ensino/minhas-turmas-virtuais/{year}/{period}/}
      SUAP_ENDPOINT_REPORT: ${SUAP_ENDPOINT_REPORT:-ensino/meu-boletim/{year}/{period}/}
      SUAP_ENDPOINT_DISCIPLINES: ${SUAP_ENDPOINT_DISCIPLINES:-ensino/disciplinas/{year}.{period}/}
      SUAP_ENDPOINT_COMPLETION_REQUIREMENTS: ${SUAP_ENDPOINT_COMPLETION_REQUIREMENTS:-ensino/requisitos-conclusao/}
      SUAP_ENDPOINT_FREQUENCY: ${SUAP_ENDPOINT_FREQUENCY:-ensino/frequencia-periodo-letivo/{year}/{period}/}
      SUAP_ENDPOINT_UPCOMING_EVALUATIONS: ${SUAP_ENDPOINT_UPCOMING_EVALUATIONS:-ensino/minhas-proximas-avaliacoes/}
      SUAP_ENDPOINT_CALENDAR: ${SUAP_ENDPOINT_CALENDAR:-ensino/meu-calendario-academico/{year}/{period}/}
      SUAP_ENDPOINT_SCHEDULE: ${SUAP_ENDPOINT_SCHEDULE:-meu-diario/horario/{year}/{period}/}
      ADMIN_SUAP_USERS: ${ADMIN_SUAP_USERS:-}

      # Assistente documental / OpenAI (opcional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      KNOWLEDGE_UPLOAD_DIR: ${KNOWLEDGE_UPLOAD_DIR:-knowledge_documents}
    expose:
      - "5003"
    networks:
      - proxy_network
      - database_network

networks:
  proxy_network:
    external: true
  database_network:
    external: true
